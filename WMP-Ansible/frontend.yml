- name: Frontend setup using nginx
  hosts: all
  become: true #Privilege escalation 
  tasks:

    - name: Install NodeJS Repo files
      ansible.builtin.shell: curl -fsSL https://rpm.nodesource.com/setup_22.x | bash -

    - name: Install nginx
      ansible.builtin.dnf:
        name: 
          - '@nginx:1.26'
          - nodejs
        state: present

    - name: Update nginx configurations
      ansible.builtin.copy:
        src: nginx.conf
        dest: /etc/nginx/nginx.conf

    - name: Recursively remove nginx directory
      ansible.builtin.file:
        path: /usr/share/nginx/html
        state: absent      

    - name: Download and extract frontend artifacts
      ansible.builtin.unarchive:
        src: curl -L -o /tmp/ https://raw.githubusercontent.com/raghudevopsb88/wealth-project/main/artifacts/frontend.tar.gz
        dest: /usr/share/nginx
        remote_src: yes    

    - name: Build frontend application
      ansible.builtin.shell: npm ci ; npm run build ; mv dist html
      args:
        chdir: /usr/share/nginx/


    - name: Start nginx service
      ansible.builtin.systemd_service:
        name: nginx
        enabled: true
        state: restarted
    

